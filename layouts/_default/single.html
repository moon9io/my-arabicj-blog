{{ define "main" }}
<article class="single-post">
    <header>
        <h1 class="post-title-main">{{ .Title }}</h1>

        <div class="post-info-bar">
            <span class="reading-badge">
                ⏱️ {{ .ReadingTime }} دقائق قراءة
            </span>
            <span class="date-display"
                >📅 {{ .Date.Format "2 يناير 2006" }}</span
            >
        </div>

        {{ if .Params.tags }}
        <div class="tags-container">
            {{ range .Params.tags }}
            <a href="/tags/{{ . | urlize }}" class="tag-link"> #{{ . }} </a>
            {{ end }}
        </div>
        {{ end }} {{ if .Params.image }}
        <div class="Others_Frieren.png">
            <img src="{{ .Params.image }}" alt="{{ .Title }}" />
        </div>
        {{ end }}
    </header>

    <div class="content">{{ .Content }}</div>

    <footer>
        <a href="/posts/" class="back-link"> <span>→</span> العودة للمقالات </a>
        <span class="thanks-msg">شكراً للقراءة ✨</span>
    </footer>
</article>

<style>
    .single-post {
        max-width: 850px; /* عرض مثالي للقراءة */
        margin: 60px auto;
        background: rgba(30, 41, 59, 0.4);
        padding: 50px;
        border-radius: 20px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(168, 85, 247, 0.1);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .post-title-main {
        font-size: 3rem;
        margin-bottom: 25px;
        background: linear-gradient(90deg, #a855f7, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.3;
        text-align: center;
        font-weight: 900;
    }

    .post-info-bar {
        color: #94a3b8;
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-bottom: 30px;
    }

    .reading-badge {
        background: rgba(139, 92, 246, 0.2);
        color: #c084fc;
        padding: 5px 15px;
        border-radius: 50px;
        border: 1px solid rgba(139, 92, 246, 0.3);
        font-size: 0.9rem;
    }

    .tags-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-bottom: 40px;
    }

    .tag-link {
        background: rgba(15, 23, 42, 0.6);
        color: #94a3b8;
        padding: 6px 18px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 0.85rem;
        transition: 0.3s;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tag-link:hover {
        background: #8b5cf6;
        color: white;
        transform: translateY(-2px);
    }

    .featured-image-wrapper {
        margin: 40px 0;
        border-radius: 15px;
        overflow: hidden;
        border: 1px solid rgba(139, 92, 246, 0.2);
    }

    .featured-image-wrapper img {
        width: 100%;
        height: auto;
        display: block;
        transition: 0.5s;
    }

    /* تحسين المحتوى الداخلي */
    .content {
        font-size: 1.2rem;
        line-height: 2;
        color: #e2e8f0;
    }

    .content h2 {
        color: white;
        margin-top: 50px;
        border-right: 5px solid #8b5cf6;
        padding-right: 15px;
    }

    /* تنسيق الأكواد البرمجية (للمهندسين) */
    .content pre {
        background: #0f172a !important;
        padding: 25px;
        border-radius: 12px;
        border: 1px solid #1e293b;
        direction: ltr; /* لضمان ظهور الكود من اليسار لليمين */
    }

    footer {
        margin-top: 60px;
        padding-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
    }

    .back-link {
        color: #a855f7;
        text-decoration: none;
        font-weight: bold;
    }

    @media (max-width: 768px) {
        .single-post {
            padding: 25px;
            margin: 20px;
        }
        .post-title-main {
            font-size: 2rem;
        }
    }
</style>
{{ end }}
