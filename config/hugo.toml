# Site Configuration for Arabic Blog
# تهيئة الموقع للمدونة العربية

baseURL = 'https://your-domain.xyz/'  # ضع رابطك هنا
title = 'اسم مدونتك'
theme = 'blowfish'  # تأكد من فك التعليق عن هذا السطر
languageCode = 'ar'
defaultContentLanguage = 'ar'
defaultContentLanguageInSubdir = false

# إعدادات هامة للغة العربية
hasCJKLanguage = false  # ليست لغة CJK ولكن تحسن معالجة النص العربي
pluralizeListTitles = false  # مهم للغة العربية
enableGitInfo = true  # مفيد لتتبع التعديلات

# تحسين محركات البحث SEO
enableRobotsTXT = true
summaryLength = 30  # عدد الكلمات في الملخص
buildDrafts = false
buildFuture = false
buildExpired = false

# المزايا الإضافية
enableEmoji = true
enableMissingTranslationPlaceholders = false
googleAnalytics = ""  # ضع ID تتبع جوجل هنا إن أردت

# التصوير والمعالجة
[imaging]
  anchor = 'Smart'
  quality = 85
  resampleFilter = 'CatmullRom'

  [imaging.exif]
    dateField = 'DateTimeOriginal'
    disableDate = false
    disableLatLong = false

# التصنيفات والفئات (Taxonomies)
[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

# خريطة الموقع (Sitemap)
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# المخرجات
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

# المحتوى ذو الصلة
[related]
  threshold = 80
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 80

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "authors"
    weight = 20

# إعدادات الترجمة
[languages.ar]
  languageCode = "ar-AR"
  languageName = "العربية"
  weight = 1
  contentDir = "content"

  # إعدادات Blowfish المحددة للغة العربية
  [languages.ar.params]
    theme = "congo"  # يمكنك اختيار: blowfish, congo, dracula, atom, nord, aqua
    defaultAppearance = "dark"  # أو "light" أو "auto"
    displayFullLangName = true

    # الروابط الاجتماعية (أزل التعليق عن التي تحتاجها)
    # social = [
    #   { name = "GitHub", icon = "fab fa-github", url = "https://github.com/username" },
    #   { name = "Twitter", icon = "fab fa-twitter", url = "https://twitter.com/username" },
    #   { name = "YouTube", icon = "fab fa-youtube", url = "https://youtube.com/@username" }
    # ]

    # القائمة الرئيسية
    [languages.ar.menu]
      [[languages.ar.menu.main]]
        name = "الرئيسية"
        url = "/"
        weight = 1

      [[languages.ar.menu.main]]
        name = "المقالات"
        url = "/posts/"
        weight = 2

      [[languages.ar.menu.main]]
        name = "الفيديوهات"
        url = "/videos/"
        weight = 3

      [[languages.ar.menu.main]]
        name = "عني"
        url = "/about/"
        weight = 4

# التخصيصات الإضافية
[params]
  # إعدادات المؤلف
  author = "اسمك"
  description = "وصف مدونتك باللغة العربية"
  homeSubtitle = "مرحباً بكم في مدونتي المتواضعة"

  # المظهر
  defaultAppearance = "dark"
  disableThemeToggle = false  # السماح للمستخدمين بتغيير الوضع

  # الميزات
  showReadingTime = true
  showWordCount = true
  showTableOfContents = true

  # التعليقات (Giscus)
  # [params.comments]
  #   enabled = true
  #   provider = "giscus"
  #   repo = "username/repo"
  #   repoId = "your_repo_id"
  #   category = "General"
  #   categoryId = "your_category_id"

  # البحث
  [params.search]
    enabled = true
    type = "fusejs"  # أو "algolia" إذا كان لديك مفتاح

  # التحليلات
  # [params.analytics]
  #   google = "G-XXXXXXXXXX"  # Google Analytics 4
  #   plausible = "your-domain.com"  # Plausible Analytics
  #   umami = "https://analytics.umami.is/script.js"  # Umami Analytics

# خدمات الطرف الثالث
[services]
  [services.googleAnalytics]
    id = ""  # ضع ID هنا إذا استخدمت Google Analytics
