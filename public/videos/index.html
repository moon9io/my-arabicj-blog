        <style>
            :root {
                --bg-dark: #0b0f1a;
                --accent-purple: #a855f7;
                --accent-blue: #3b82f6;
                --text-main: #e2e8f0;
                --text-dim: #94a3b8;
                --card-bg: rgba(30, 41, 59, 0.45);
                --nav-bg: rgba(11, 15, 26, 0.7);
                --glow: 0 0 20px rgba(168, 85, 247, 0.3);
                --gradient: linear-gradient(
                    90deg,
                    var(--accent-purple),
                    var(--accent-blue)
                );
            }

            body {
                margin: 0;
                line-height: 1.6;
                color: var(--text-main);

                 
                background:
                     
                    linear-gradient(
                        to bottom,
                        rgba(11, 15, 26, 0.9) 0%,
                        rgba(11, 15, 26, 0.7) 50%,
                        rgba(11, 15, 26, 0.9) 100%
                    ),
                     
                    url("Others_Frieren.png");

                 
                background-attachment: fixed;
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;

                 
                image-rendering: -webkit-optimize-contrast;
                background-color: #0b0f1a;  
            }

             
            body::after {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url("https://www.transparenttextures.com/patterns/stardust.png");  
                opacity: 0.02;  
                pointer-events: none;
                z-index: -1;
            }

             
            .navbar {
                position: fixed;
                top: 0;
                width: 100%;
                height: 65px;
                background: var(--nav-bg);
                backdrop-filter: blur(12px);
                display: flex;
                justify-content: space-around;
                align-items: center;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                z-index: 2000;
            }

            .nav-links a {
                color: var(--text-main);
                text-decoration: none;
                margin: 0 15px;
                font-size: 0.95rem;
                transition: 0.3s;
                opacity: 0.8;
            }

            .nav-links a:hover {
                opacity: 1;
                color: var(--accent-purple);
            }

             
            .container {
                max-width: 1000px;
                margin: 100px auto 40px;
                padding: 0 20px;
            }

             
            .header-profile {
                text-align: center;
                margin-bottom: 60px;
            }

            .avatar-glow {
                width: 130px;
                height: 130px;
                border-radius: 50%;
                border: 3px solid var(--accent-purple);
                box-shadow: var(--glow);
                margin-bottom: 20px;
                transition: 0.5s;
            }

            .avatar-glow:hover {
                transform: rotate(5deg) scale(1.05);
            }

            .hallos-title {
                font-size: 2.5rem;
                font-weight: 900;
                margin: 0;
                background: var(--gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .social-icons {
                margin-top: 15px;
                font-size: 1.5rem;
                display: flex;
                justify-content: center;
                gap: 20px;
            }

            .social-icons a {
                color: var(--text-dim);
                text-decoration: none;
                transition: 0.3s;
            }
            .social-icons a:hover {
                color: var(--accent-purple);
                transform: translateY(-3px);
            }

             
            .post-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 25px;
                margin-top: 40px;
            }

            .post-card {
                background: var(--card-bg);
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.05);
                transition: all 0.3s ease;
                backdrop-filter: blur(8px);
                position: relative;
            }

            .post-card::before {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                width: 4px;
                height: 100%;
                background: var(--gradient);
                opacity: 0;
                transition: 0.3s;
            }

            .post-card:hover {
                transform: translateY(-8px);
                border-color: rgba(168, 85, 247, 0.4);
                box-shadow: var(--glow);
            }

            .post-card:hover::before {
                opacity: 1;
            }

            .post-img {
                width: 100%;
                height: 180px;
                object-fit: cover;
            }
            .post-info {
                padding: 20px;
            }
            .post-info h2 {
                font-size: 1.2rem;
                margin: 10px 0;
                line-height: 1.4;
                color: white;
            }

            .btn-more {
                display: inline-block;
                margin: 40px auto;
                padding: 10px 30px;
                border: 1px solid var(--accent-purple);
                border-radius: 5px;
                color: white;
                text-decoration: none;
                transition: 0.3s;
            }

            .btn-more:hover {
                background: var(--accent-purple);
                box-shadow: var(--glow);
            }
        </style>
    </head>
